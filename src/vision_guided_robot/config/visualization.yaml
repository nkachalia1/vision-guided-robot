robot_visualization:
  ros__parameters:
    use_sim_time: true
    odom_topic: "/odom"
    path_topic: "/odom_path"
    footprint_topic: "/robot_footprint"
    odom_frame: "odom"
    base_frame: "base_link"
    max_path_poses: 500
    min_path_step_m: 0.02
    footprint_length_m: 0.34
    footprint_width_m: 0.24
    footprint_publish_hz: 5.0
