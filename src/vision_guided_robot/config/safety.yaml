    use_sim_time: true
    cmd_vel_raw_topic: "/cmd_vel_raw"
    cmd_vel_topic: "/cmd_vel"
    scan_topic: "/scan"
    state_topic: "/safety/state"
    control_rate_hz: 30.0

    obstacle_stop_distance_m: 0.28
